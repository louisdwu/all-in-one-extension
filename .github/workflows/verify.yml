name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: static checks + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static integrity (manifest / imports / DOM ids / locales / secrets)
        run: node tools/check.mjs
      - name: Unit tests
        run: node --test --test-force-exit tests/*.test.js

  browser:
    name: smoke + behavioural regression (real Chromium)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Smoke test (load the extension, assert zero runtime errors)
        env:
          AIO_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/smoke.mjs
      - name: Behavioural regression
        env:
          AIO_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/regression.mjs
