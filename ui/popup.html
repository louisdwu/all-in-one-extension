<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>AIO</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="header">
        <span class="title">🌟 All in One</span>
        <button type="button" id="open-options" class="icon-btn" title="打开设置" aria-label="打开设置">⚙️</button>
    </header>

    <main class="dashboard">
        <section class="card" id="card-hud">
            <div class="card-title">
                <span>🖥️ HUD 监控</span>
                <label class="toggle" title="HUD 总开关">
                    <input type="checkbox" id="hud-toggle" aria-label="HUD 总开关">
                    <span class="slider"></span>
                </label>
            </div>
            <div id="hud-list" class="hud-list">加载中…</div>
        </section>

        <section class="card">
            <div class="card-title">
                <span>🖱️ 标签页切换</span>
                <label class="toggle" title="右键 + 滚轮切换标签页">
                    <input type="checkbox" id="aio-tabs-toggle" aria-label="标签页切换">
                    <span class="slider"></span>
                </label>
            </div>
            <p class="hint">按住<strong>鼠标右键</strong>并<strong>滚动滚轮</strong>呼出标签列表。</p>
        </section>

        <section class="card">
            <div class="card-title">
                <span>🎬 视频倍速</span>
                <label class="toggle" title="全局启用倍速">
                    <input type="checkbox" id="speeder-toggle" aria-label="视频倍速">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="speed-row">
                <span class="speed-value" id="speed-value">1.00x</span>
                <span class="speed-state" id="speed-state">当前标签页</span>
            </div>
            <div class="btn-row">
                <button type="button" id="speed-down">− 减速</button>
                <button type="button" id="speed-up">+ 加速</button>
                <button type="button" id="speed-preset" class="primary">预设</button>
            </div>
            <p class="hint" id="speed-hint"></p>
        </section>

        <section class="card">
            <div class="card-title">
                <span>🎹 本站快捷键映射</span>
                <label class="toggle" title="在本站启用映射">
                    <input type="checkbox" id="hotkey-toggle" aria-label="本站快捷键映射">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="site-row"><span id="hotkey-site">读取中…</span></div>
            <div class="recorder">
                <input type="text" id="hotkey-original" readonly placeholder="原键" aria-label="原按键">
                <span class="arrow">→</span>
                <input type="text" id="hotkey-new" readonly placeholder="新键" aria-label="新按键">
            </div>
            <div class="btn-row">
                <button type="button" id="hotkey-add" class="primary">添加映射</button>
                <button type="button" id="hotkey-clear" class="danger">清空本站</button>
            </div>
            <div id="hotkey-list" class="mapping-list"></div>
        </section>

        <section class="card">
            <div class="card-title"><span>🕵️ 无痕按键</span></div>
            <p class="hint">按住 <strong id="ez-key">Ctrl</strong> 并左键点击链接，即可在无痕窗口打开。</p>
        </section>
    </main>

    <script type="module" src="popup.js"></script>
</body>

</html>
